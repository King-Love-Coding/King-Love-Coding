<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLangs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f24"/>
      <stop offset="100%" stop-color="#231738"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <rect width="450" height="200" rx="12" fill="url(#bgLangs)" stroke="#bd93f9" stroke-opacity="0.3" stroke-width="1.5"/>

  <g transform="translate(30, 35)">
    <text x="0" y="0" fill="#bd93f9" font-size="15" font-weight="bold" class="sans">Top Stacks &amp; Languages</text>

    <!-- Progress Bars -->
    <g transform="translate(0, 25)">
      <text x="0" y="0" fill="#f8f8f2" font-size="12" class="sans">JavaScript &amp; TypeScript (45%)</text>
      <rect x="0" y="8" width="390" height="6" rx="3" fill="#282a36"/>
      <rect x="0" y="8" width="175" height="6" rx="3" fill="#f1fa8c"/>
    </g>

    <g transform="translate(0, 60)">
      <text x="0" y="0" fill="#f8f8f2" font-size="12" class="sans">React &amp; Next.js (30%)</text>
      <rect x="0" y="8" width="390" height="6" rx="3" fill="#282a36"/>
      <rect x="0" y="8" width="117" height="6" rx="3" fill="#61dafb"/>
    </g>

    <g transform="translate(0, 95)">
      <text x="0" y="0" fill="#f8f8f2" font-size="12" class="sans">HTML5 / Modern CSS / UI (15%)</text>
      <rect x="0" y="8" width="390" height="6" rx="3" fill="#282a36"/>
      <rect x="0" y="8" width="58" height="6" rx="3" fill="#ff79c6"/>
    </g>

    <g transform="translate(0, 130)">
      <text x="0" y="0" fill="#f8f8f2" font-size="12" class="sans">SQL &amp; Backend Systems (10%)</text>
      <rect x="0" y="8" width="390" height="6" rx="3" fill="#282a36"/>
      <rect x="0" y="8" width="40" height="6" rx="3" fill="#50fa7b"/>
    </g>
  </g>
</svg>