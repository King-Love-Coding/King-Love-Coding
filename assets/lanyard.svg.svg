<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" width="100%" height="100%">
  <defs>
    <linearGradient id="lanyardStrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="50%" stop-color="#ff92d0"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>

    <linearGradient id="badgeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19132d"/>
      <stop offset="100%" stop-color="#0f0c1b"/>
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    @keyframes swing {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(4deg); }
      40% { transform: rotate(-3deg); }
      60% { transform: rotate(2deg); }
      80% { transform: rotate(-1deg); }
      100% { transform: rotate(0deg); }
    }
    .swing-card {
      transform-origin: 190px 0px;
      animation: swing 6s ease-in-out infinite;
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <g class="swing-card">
    <!-- Lanyard Straps -->
    <polygon points="175,0 185,0 185,90 175,90" fill="url(#lanyardStrap)" />
    <polygon points="195,0 205,0 205,90 195,90" fill="url(#lanyardStrap)" />
    
    <!-- Metal Clip & Ring -->
    <rect x="170" y="85" width="40" height="12" rx="3" fill="#cbd5e1" />
    <circle cx="190" cy="105" r="10" fill="none" stroke="#94a3b8" stroke-width="4" />

    <!-- ID Card Container -->
    <g transform="translate(50, 115)" filter="url(#badgeShadow)">
      <rect width="280" height="380" rx="16" fill="url(#badgeBody)" stroke="#ff79c6" stroke-width="1.5" />
      
      <!-- Top Slot -->
      <rect x="110" y="12" width="60" height="6" rx="3" fill="#0f0c1b" stroke="#44475a" stroke-width="1"/>

      <!-- Avatar Ring -->
      <circle cx="140" cy="95" r="48" fill="#282a36" stroke="#ff79c6" stroke-width="2"/>
      <clipPath id="avatarClip">
        <circle cx="140" cy="95" r="46"/>
      </clipPath>
      <image href="avatar.png" x="90" y="45" width="100" height="100" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

      <!-- Name & Role -->
      <text x="140" y="175" fill="#f8f8f2" font-size="18" font-weight="bold" text-anchor="middle" class="sans">Vivek Bhati</text>
      <text x="140" y="196" fill="#bd93f9" font-size="12" text-anchor="middle" class="sans" font-weight="600">Full Stack Developer</text>
      
      <rect x="35" y="215" width="210" height="1" fill="#44475a"/>

      <!-- Details -->
      <text x="40" y="245" fill="#6272a4" font-size="11" class="mono">HANDLE:</text>
      <text x="240" y="245" fill="#50fa7b" font-size="11" text-anchor="end" class="mono">@King-Love-Coding</text>

      <text x="40" y="275" fill="#6272a4" font-size="11" class="mono">ROLE:</text>
      <text x="240" y="275" fill="#8be9fd" font-size="11" text-anchor="end" class="mono">Web / Full Stack</text>

      <text x="40" y="305" fill="#6272a4" font-size="11" class="mono">STATUS:</text>
      <text x="240" y="305" fill="#f1fa8c" font-size="11" text-anchor="end" class="mono">Active ☕</text>

      <!-- Barcode simulation -->
      <g transform="translate(40, 330)">
        <rect x="0" y="0" width="4" height="25" fill="#f8f8f2"/>
        <rect x="8" y="0" width="2" height="25" fill="#f8f8f2"/>
        <rect x="14" y="0" width="6" height="25" fill="#f8f8f2"/>
        <rect x="24" y="0" width="3" height="25" fill="#f8f8f2"/>
        <rect x="32" y="0" width="8" height="25" fill="#f8f8f2"/>
        <rect x="44" y="0" width="2" height="25" fill="#f8f8f2"/>
        <rect x="52" y="0" width="5" height="25" fill="#f8f8f2"/>
        <rect x="62" y="0" width="2" height="25" fill="#f8f8f2"/>
        <rect x="70" y="0" width="6" height="25" fill="#f8f8f2"/>
        <rect x="80" y="0" width="3" height="25" fill="#f8f8f2"/>
        <rect x="90" y="0" width="7" height="25" fill="#f8f8f2"/>
        <rect x="102" y="0" width="2" height="25" fill="#f8f8f2"/>
        <rect x="110" y="0" width="5" height="25" fill="#f8f8f2"/>
        <rect x="120" y="0" width="4" height="25" fill="#f8f8f2"/>
        <rect x="130" y="0" width="6" height="25" fill="#f8f8f2"/>
        <rect x="142" y="0" width="2" height="25" fill="#f8f8f2"/>
        <rect x="150" y="0" width="8" height="25" fill="#f8f8f2"/>
        <rect x="164" y="0" width="3" height="25" fill="#f8f8f2"/>
        <rect x="172" y="0" width="6" height="25" fill="#f8f8f2"/>
        <rect x="184" y="0" width="4" height="25" fill="#f8f8f2"/>
        <rect x="194" y="0" width="6" height="25" fill="#f8f8f2"/>
      </g>
    </g>
  </g>
</svg>
