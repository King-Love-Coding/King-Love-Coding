<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8f9fe"/>
      <stop offset="100%" stop-color="#f0effb"/>
    </linearGradient>

    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d63384"/>
      <stop offset="50%" stop-color="#6f42c1"/>
      <stop offset="100%" stop-color="#0d6efd"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    @keyframes blinkL { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor-light { animation: blinkL 0.9s infinite; }
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1280" height="500" rx="20" fill="url(#bgGradLight)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Terminal Header -->
  <g transform="translate(45, 45)">
    <rect width="700" height="32" rx="6" fill="#f1f5f9" />
    <circle cx="16" cy="16" r="5" fill="#ff5f56" />
    <circle cx="32" cy="16" r="5" fill="#ffbd2e" />
    <circle cx="48" cy="16" r="5" fill="#27c93f" />
    <text x="70" y="21" fill="#64748b" font-size="12" class="mono">King-Love-Coding: ~ cat README.md</text>
  </g>

  <!-- Main Info Section -->
  <g transform="translate(45, 125)">
    <text x="0" y="45" fill="url(#textGradLight)" font-size="44" font-weight="800" class="sans" letter-spacing="1">Vivek Bhati</text>
    <text x="0" y="80" fill="#1e293b" font-size="20" font-weight="600" class="mono">Full Stack Developer &amp; Web Developer<tspan class="cursor-light" fill="#d63384">_</tspan></text>
    
    <!-- Tagline Card -->
    <rect x="0" y="110" width="660" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#softShadow)"/>
    <text x="20" y="140" fill="#475569" font-size="14" class="mono">"Turning caffeine into clean code ☕ → 💻"</text>

    <!-- Skill Tags -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="115" height="30" rx="15" fill="#fdf2f8" stroke="#f472b6" stroke-width="1"/>
      <text x="57" y="19" fill="#db2777" font-size="12" text-anchor="middle" class="sans" font-weight="600">Leadership</text>

      <rect x="125" y="0" width="115" height="30" rx="15" fill="#f5f3ff" stroke="#c084fc" stroke-width="1"/>
      <text x="182" y="19" fill="#9333ea" font-size="12" text-anchor="middle" class="sans" font-weight="600">Team Work</text>

      <rect x="250" y="0" width="130" height="30" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
      <text x="315" y="19" fill="#2563eb" font-size="12" text-anchor="middle" class="sans" font-weight="600">Code Analyzer</text>

      <rect x="390" y="0" width="110" height="30" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
      <text x="445" y="19" fill="#059669" font-size="12" text-anchor="middle" class="sans" font-weight="600">Patience</text>

      <rect x="510" y="0" width="95" height="30" rx="15" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
      <text x="557" y="19" fill="#d97706" font-size="12" text-anchor="middle" class="sans" font-weight="600">Focus</text>
    </g>

    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="320" height="42" rx="8" fill="#ffffff" stroke="#d63384" stroke-width="1.5" filter="url(#softShadow)"/>
      <text x="160" y="26" fill="#d63384" font-size="13" font-weight="bold" text-anchor="middle" class="mono" letter-spacing="2">⚡ KEEP CODING • KEEP GROWING</text>
    </g>
  </g>

  <!-- Right Avatar Area -->
  <g transform="translate(860, 45)">
    <rect width="360" height="410" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
    <image href="avatar.png" x="10" y="10" width="340" height="390" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
