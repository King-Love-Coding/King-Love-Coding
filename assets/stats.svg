<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f24"/>
      <stop offset="100%" stop-color="#231738"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <rect width="450" height="200" rx="12" fill="url(#bgGrad)" stroke="#ff79c6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Rank Circle -->
  <g transform="translate(65, 100)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#282a36" stroke-width="6"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff79c6" stroke-width="6" stroke-dasharray="280" stroke-dashoffset="50" stroke-linecap="round"/>
    <text x="0" y="8" fill="#f8f8f2" font-size="22" font-weight="bold" text-anchor="middle" class="sans">A+</text>
    <text x="0" y="24" fill="#6272a4" font-size="10" text-anchor="middle" class="mono">RANK</text>
  </g>

  <!-- Stat Items -->
  <g transform="translate(150, 40)">
    <text x="0" y="0" fill="#ff79c6" font-size="15" font-weight="bold" class="sans">Vivek's GitHub Performance</text>

    <g transform="translate(0, 30)">
      <text x="0" y="0" fill="#f8f8f2" font-size="13" class="sans">Total Contributions:</text>
      <text x="260" y="0" fill="#50fa7b" font-size="13" font-weight="bold" text-anchor="end" class="mono">1,420+</text>
    </g>

    <g transform="translate(0, 60)">
      <text x="0" y="0" fill="#f8f8f2" font-size="13" class="sans">Pull Requests / Reviews:</text>
      <text x="260" y="0" fill="#8be9fd" font-size="13" font-weight="bold" text-anchor="end" class="mono">180+</text>
    </g>

    <g transform="translate(0, 90)">
      <text x="0" y="0" fill="#f8f8f2" font-size="13" class="sans">Repository Stars Earned:</text>
      <text x="260" y="0" fill="#f1fa8c" font-size="13" font-weight="bold" text-anchor="end" class="mono">95+</text>
    </g>

    <g transform="translate(0, 120)">
      <text x="0" y="0" fill="#f8f8f2" font-size="13" class="sans">Code Quality Score:</text>
      <text x="260" y="0" fill="#bd93f9" font-size="13" font-weight="bold" text-anchor="end" class="mono">99.4%</text>
    </g>
  </g>
</svg>
